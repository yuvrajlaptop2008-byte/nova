name: Nova
options:
  bundleIdPrefix: ai.novafoundation
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  NovaKit:
    path: ../shared/NovaKit
  Swabble:
    path: ../swabble
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 147.0.0

schemes:
  Nova:
    shared: true
    build:
      targets:
        Nova: all
    test:
      targets:
        - NovaTests
        - NovaLogicTests
  NovaLogicTests:
    shared: true
    build:
      targets:
        NovaLogicTests: all
    test:
      targets:
        - NovaLogicTests
  NovaUITests:
    shared: true
    build:
      targets:
        NovaUITests: all
    test:
      targets:
        - NovaUITests
  NovaWatchApp:
    shared: true
    build:
      targets:
        NovaWatchApp: all

targets:
  Nova:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: NovaShareExtension
        embed: true
      - target: NovaActivityWidget
        embed: true
      # A companion watch application belongs in the standard Watch bundle location.
      # PlugIns is for extension products and breaks paired watch installation.
      - target: NovaWatchApp
      - package: NovaKit
      - package: NovaKit
        product: NovaChatUI
      - package: NovaKit
        product: NovaProtocol
      - package: Swabble
        product: SwabbleKit
      - package: WebRTC
      - sdk: AppIntents.framework
      - sdk: HealthKit.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftformat
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchApp,$SRCROOT/../shared/NovaKit/Sources/NovaChatUI,$SRCROOT/../shared/NovaKit/Sources/NovaKit,$SRCROOT/../shared/NovaKit/Sources/NovaNativeState,$SRCROOT/../shared/NovaKit/Sources/NovaProtocol,$SRCROOT/../swabble/Sources/SwabbleKit" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftlint
          swiftlint lint --strict --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(NOVA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: "$(NOVA_CODE_SIGN_ENTITLEMENTS)"
        CODE_SIGN_STYLE: "$(NOVA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NOVA_DEVELOPMENT_TEAM)"
        NOVA_ACTIVE_APP_GROUP_ID: "$(NOVA_APP_GROUP_ID)"
        NOVA_APP_DISPLAY_NAME: Nova
        NOVA_URL_SCHEME: nova
        PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NOVA_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          NOVA_ACTIVE_APP_GROUP_ID: "$(NOVA_DEBUG_APP_GROUP_ID)"
          NOVA_APP_DISPLAY_NAME: Nova
          NOVA_CODE_SIGN_ENTITLEMENTS: Sources/Nova.entitlements
          NOVA_APNS_ENTITLEMENT_ENVIRONMENT: development
          NOVA_URL_SCHEME: nova-debug
          PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_DEBUG_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
          NOVA_PUSH_MODE: localSandbox
          NOVA_PUSH_RELAY_BASE_URL: ""
        Release:
          NOVA_CODE_SIGN_ENTITLEMENTS: Sources/Nova.entitlements
          NOVA_APNS_ENTITLEMENT_ENVIRONMENT: production
          NOVA_PUSH_MODE: localProduction
          NOVA_PUSH_RELAY_BASE_URL: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "$(NOVA_APP_DISPLAY_NAME)"
        CFBundleIconName: "$(ASSETCATALOG_COMPILER_APPICON_NAME)"
        CFBundleURLTypes:
          - CFBundleURLName: ai.novafoundation.app
            CFBundleURLSchemes:
              - "$(NOVA_URL_SCHEME)"
        CFBundleShortVersionString: "$(NOVA_MARKETING_VERSION)"
        NovaCanonicalVersion: "$(NOVA_IOS_VERSION)"
        NovaGitCommit: "$(NOVA_GIT_COMMIT)"
        NovaBuildTimestamp: "$(NOVA_BUILD_TIMESTAMP)"
        NovaAppGroupIdentifier: "$(NOVA_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(NOVA_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - location
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).bgrefresh"
        NSLocalNetworkUsageDescription: Nova discovers and connects to your Nova gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _nova-gw._tcp
        NSCameraUsageDescription: Nova uses the camera when you scan a Gateway setup QR code or ask your paired Gateway or assistant to capture a photo or short video from this iPhone, for example to connect to your Gateway or show your assistant a document, device screen, or workspace.
        NSCalendarsUsageDescription: Nova uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: Nova uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: Nova uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: Nova uses your contacts so you can search and reference people while using the assistant.
        NSLocationWhenInUseUsageDescription: Nova uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Nova can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Nova uses the microphone for realtime chat, voice wake, push-to-talk, and voice notes.
        NSMotionUsageDescription: Nova may use motion data to support device-aware interactions and automations.
        NSHealthShareUsageDescription: Nova reads your steps, sleep, resting heart rate, and workouts from the Apple Health app to create summaries you request and send them through your Gateway to your configured AI provider.
        NSHealthUpdateUsageDescription: Nova does not write to the Apple Health app. It uses read-only data to create summaries you request and send them through your Gateway to your configured AI provider.
        NSPhotoLibraryUsageDescription: Nova lets your assistant read photos you allow and lets you choose photos to share.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSRemindersFullAccessUsageDescription: Nova uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: Nova uses on-device speech recognition for talk mode and voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        NovaPushMode: "$(NOVA_PUSH_MODE)"
        NovaPushRelayBaseURL: "$(NOVA_PUSH_RELAY_BASE_URL)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  NovaShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: NovaKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NOVA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/NovaShareExtension.entitlements
        CODE_SIGN_STYLE: "$(NOVA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NOVA_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        NOVA_ACTIVE_APP_GROUP_ID: "$(NOVA_APP_GROUP_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NOVA_SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          NOVA_ACTIVE_APP_GROUP_ID: "$(NOVA_DEBUG_APP_GROUP_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_DEBUG_SHARE_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Nova Share
        CFBundleShortVersionString: "$(NOVA_MARKETING_VERSION)"
        NovaAppGroupIdentifier: "$(NOVA_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(NOVA_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  NovaActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/NovaActivityAttributes.swift
      # Shared continuous avatar waveform; dependency-free for widget isolation.
      - path: ../shared/NovaKit/Sources/NovaChatUI/TalkWaveformView.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NOVA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NOVA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NOVA_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_ACTIVITY_WIDGET_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NOVA_ACTIVITY_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_DEBUG_ACTIVITY_WIDGET_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Nova Activity
        CFBundleShortVersionString: "$(NOVA_MARKETING_VERSION)"
        CFBundleVersion: "$(NOVA_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  NovaWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
      - path: Sources/Services/WatchSessionActivationGate.swift
        group: Sources/Services
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
      # Universal talk waveform, compiled directly to keep the watch styling local.
      - path: ../shared/NovaKit/Sources/NovaChatUI/TalkWaveformView.swift
        group: Shared
      # Universal mascot, compiled directly to keep the watch styling local.
      - path: ../shared/NovaKit/Sources/NovaChatUI/NovaMascotView.swift
        group: Shared
      - path: ../shared/NovaKit/Sources/NovaChatUI/NovaMascotAnimator.swift
        group: Shared
      - path: ../shared/NovaKit/Sources/NovaChatUI/NovaMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/NovaKit/Sources/NovaChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: NovaKit
        product: NovaKit
      - sdk: AppIntents.framework
      - sdk: AVFAudio.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(NOVA_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(NOVA_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(NOVA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NOVA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NOVA_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        NOVA_COMPANION_APP_BUNDLE_ID: "$(NOVA_APP_BUNDLE_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NOVA_WATCH_APP_PROFILE)"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          NOVA_COMPANION_APP_BUNDLE_ID: "$(NOVA_DEBUG_APP_BUNDLE_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_DEBUG_WATCH_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Nova
        CFBundleShortVersionString: "$(NOVA_MARKETING_VERSION)"
        CFBundleVersion: "$(NOVA_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(NOVA_COMPANION_APP_BUNDLE_ID)"
        WKApplication: true
        WKPrefersNetworkUponForeground: true
        NSLocalNetworkUsageDescription: Nova connects this Apple Watch directly to your Gateway on trusted local networks.
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf

  NovaTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
      - path: WatchApp/Sources/WatchDeferredPayloadOrdering.swift
        group: WatchApp/Sources
    dependencies:
      - target: Nova
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NOVA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NOVA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NOVA_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_APP_BUNDLE_ID).tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nova.app/Nova"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_DEBUG_APP_BUNDLE_ID).tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: NovaTests
        CFBundleShortVersionString: "$(NOVA_MARKETING_VERSION)"
        CFBundleVersion: "$(NOVA_BUILD_VERSION)"

  NovaLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
      - path: ShareExtension/ShareDraftComposer.swift
        group: ShareExtension
      - path: ShareExtension/ShareComposeState.swift
        group: ShareExtension
      - path: ShareExtension/ShareAttachmentSummary.swift
        group: ShareExtension
      - path: WatchApp/Sources/WatchVoiceTurnTracker.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchInboxMessages.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchMascot.swift
        group: WatchApp/Sources
      - path: ../shared/NovaKit/Sources/NovaChatUI/NovaMascotView.swift
        group: Shared
      - path: ../shared/NovaKit/Sources/NovaChatUI/NovaMascotAnimator.swift
        group: Shared
      - path: ../shared/NovaKit/Sources/NovaChatUI/NovaMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/NovaKit/Sources/NovaChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
    dependencies:
      - package: NovaKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NOVA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NOVA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NOVA_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_APP_BUNDLE_ID).logic-tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_DEBUG_APP_BUNDLE_ID).logic-tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: NovaLogicTests
        CFBundleShortVersionString: "$(NOVA_MARKETING_VERSION)"
        CFBundleVersion: "$(NOVA_BUILD_VERSION)"

  NovaUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: Nova
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NOVA_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NOVA_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NOVA_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_APP_BUNDLE_ID).ui-tests"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: Nova
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(NOVA_DEBUG_APP_BUNDLE_ID).ui-tests"
    info:
      path: UITests/Info.plist
      properties:
        CFBundleDisplayName: NovaUITests
        CFBundleShortVersionString: "$(NOVA_MARKETING_VERSION)"
        CFBundleVersion: "$(NOVA_BUILD_VERSION)"
