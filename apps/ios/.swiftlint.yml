parent_config: ../../config/swiftlint.yml

included:
  - Sources
  - ShareExtension
  - ActivityWidget
  - WatchApp
  - ../shared/NovaKit/Sources/NovaChatUI
  - ../shared/NovaKit/Sources/NovaKit
  - ../shared/NovaKit/Sources/NovaNativeState
  - ../shared/NovaKit/Sources/NovaProtocol
  - ../swabble/Sources/SwabbleKit

excluded:
  - ../macos
  - ../macos-mlx-tts
  - ../shared/NovaKit/Sources/NovaProtocol/GatewayModels.swift

type_body_length:
  warning: 900
  error: 1300

custom_rules:
  nova_design_colors:
    name: "Nova design colors"
    excluded:
      - Sources/Design/NovaBrand.swift
      - ../shared/NovaKit/Sources/NovaChatUI/ChatTheme.swift
    regex: '(Color\.accentColor|(^|[^A-Za-z0-9_])\.accentColor\b|Color\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|\.(foregroundStyle|tint|fill|stroke|strokeBorder|background)\(\s*\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|Color\(red:\s*0\s*/\s*255\.0,\s*green:\s*122\s*/\s*255\.0,\s*blue:\s*255\s*/\s*255\.0\))'
    message: "Use NovaBrand or NovaChatTheme design tokens instead of raw accent/status colors."
    severity: error
